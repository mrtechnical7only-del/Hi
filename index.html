<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Face Scanner Prank</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body { margin: 0; padding: 0; background-color: #050505; color: #0f0; font-family: 'Share Tech Mono', monospace; display: flex; height: 100vh; overflow: hidden; }

        .scanner-container { position: relative; width: 65%; height: 100%; border-right: 3px solid #0f0; box-shadow: inset 0 0 50px rgba(0, 255, 0, 0.2); display: flex; justify-content: center; align-items: center; background: #000; }
        .input_video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.6; }
        .output_canvas { position: absolute; width: 100%; height: 100%; transform: scaleX(-1); z-index: 2; }
        
        .laser { position: absolute; width: 100%; height: 4px; background-color: rgba(0, 255, 0, 0.8); box-shadow: 0 0 15px 5px rgba(0, 255, 0, 0.5); top: 0; left: 0; z-index: 3; animation: scan 3s linear infinite; }
        @keyframes scan { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }

        .terminal-container { width: 35%; padding: 20px; background: rgba(0, 10, 0, 0.9); display: flex; flex-direction: column; box-sizing: border-box; position: relative; }
        .header { font-size: 24px; border-bottom: 2px dashed #0f0; padding-bottom: 10px; margin-bottom: 20px; text-shadow: 0 0 5px #0f0; display: flex; justify-content: space-between; }
        .blink { animation: blinker 1s linear infinite; color: red; text-shadow: 0 0 10px red; }
        @keyframes blinker { 50% { opacity: 0; } }
        .terminal-text { font-size: 18px; line-height: 1.8; white-space: pre-wrap; text-shadow: 0 0 3px #0f0; }
        .overlay-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 255, 0, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 0, 0.1) 1px, transparent 1px); background-size: 30px 30px; z-index: 1; pointer-events: none; }
    </style>
</head>
<body>

    <div class="scanner-container">
        <div class="overlay-grid"></div>
        <video class="input_video" autoplay playsinline></video>
        <canvas class="output_canvas"></canvas>
        <div class="laser" id="laser-line"></div>
    </div>

    <div class="terminal-container">
        <div class="header">
            <span>DATABASE SEARCH</span>
            <span id="status-indicator">SCANNING...</span>
        </div>
        <div class="terminal-text" id="terminal"></div>
    </div>

    <script>
        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.querySelector('.output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const terminalInfo = document.getElementById('terminal');
        const statusIndicator = document.getElementById('status-indicator');
        const laser = document.getElementById('laser-line');

        let isLocked = false;
        let scanTimer = null;
        let typingStarted = false;

        const targetDetails = [
            "> ANALYZING BIOMETRICS...",
            "> CROSS-REFERENCING DATABASE...",
            "> MATCH FOUND! 99.9% ACCURACY.",
            " ",
            "---------------------------------",
            " IDENTIFICATION DATA",
            "---------------------------------",
            " NAME        : Hippo",
            " AGE         : 30",
            " ADDRESS     : Killa road nanded,",
            "               Maharashtra 431602",
            " MOBILE DEV. : Oneplus",
            " MOBILE NO.  : 8855931702",
            "---------------------------------",
            " ",
            "> TARGET LOCKED 🔴"
        ];

        async function typeWriterEffect(lines) {
            terminalInfo.innerHTML = "";
            statusIndicator.innerText = "MATCH FOUND";
            statusIndicator.className = "blink";
            laser.style.backgroundColor = "rgba(255, 0, 0, 0.8)"; 
            laser.style.boxShadow = "0 0 15px 5px rgba(255, 0, 0, 0.5)";

            for (let i = 0; i < lines.length; i++) {
                let currentLine = lines[i];
                let lineDiv = document.createElement('div');
                terminalInfo.appendChild(lineDiv);
                
                for (let j = 0; j < currentLine.length; j++) {
                    lineDiv.innerHTML += currentLine.charAt(j);
                    await new Promise(r => setTimeout(r, 30)); 
                }
                await new Promise(r => setTimeout(r, 200)); 
            }
        }

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Jab Face mil jaye
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                // Face ke points nikalna box banane ke liye
                let minX = 1, minY = 1, maxX = 0, maxY = 0;
                for (const landmark of landmarks) {
                    if (landmark.x < minX) minX = landmark.x;
                    if (landmark.x > maxX) maxX = landmark.x;
                    if (landmark.y < minY) minY = landmark.y;
                    if (landmark.y > maxY) maxY = landmark.y;
                }
                
                const padding = 30; // Box ko thoda bada rakhne ke liye
                const x = minX * canvasElement.width - padding;
                const y = minY * canvasElement.height - padding * 1.5;
                const w = (maxX - minX) * canvasElement.width + padding * 2;
                const h = (maxY - minY) * canvasElement.height + padding * 3;

                // Color decide karna (Pehle green, lock hone par red)
                const mainColor = isLocked ? "#ff0000" : "#00ff00";
                const meshColor = isLocked ? "rgba(255, 0, 0, 0.4)" : "rgba(0, 255, 0, 0.4)";

                // ✅ MAIN MAGIC: Face par points aur lines (Mesh) draw karna
                drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: meshColor, lineWidth: 1});

                // Face ke gird Sci-fi Box
                canvasCtx.strokeStyle = mainColor;
                canvasCtx.lineWidth = 3;
                const cornerLength = 30;
                canvasCtx.beginPath();
                canvasCtx.moveTo(x, y + cornerLength); canvasCtx.lineTo(x, y); canvasCtx.lineTo(x + cornerLength, y);
                canvasCtx.moveTo(x + w - cornerLength, y); canvasCtx.lineTo(x + w, y); canvasCtx.lineTo(x + w, y + cornerLength);
                canvasCtx.moveTo(x, y + h - cornerLength); canvasCtx.lineTo(x, y + h); canvasCtx.lineTo(x + cornerLength, y + h);
                canvasCtx.moveTo(x + w - cornerLength, y + h); canvasCtx.lineTo(x + w, y + h); canvasCtx.lineTo(x + w, y + h - cornerLength);
                canvasCtx.stroke();

                // 2 second baad lock karna
                if (!isLocked && !scanTimer) {
                    scanTimer = setTimeout(() => {
                        isLocked = true;
                        if (!typingStarted) {
                            typingStarted = true;
                            typeWriterEffect(targetDetails);
                        }
                    }, 2000); 
                }
            } else {
                if (!isLocked) {
                    clearTimeout(scanTimer);
                    scanTimer = null;
                }
            }
            canvasCtx.restore();
        }

        // Face Mesh Setup
        const faceMesh = new FaceMesh({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
        }});
        faceMesh.setOptions({
            maxNumFaces: 1, // Ek waqt mein 1 face
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        faceMesh.onResults(onResults);

        // Start Camera
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        camera.start();
    </script>
</body>
</html>
